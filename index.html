<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@500&display=swap" rel="stylesheet">

<title>AURA.HDX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="particles"></canvas>

<header class="header">
  <h1 class="logo">AURA<span>.HDX</span></h1>

  <!-- BIG DISCORD ICON -->
  <a href="#" onclick="coming()" class="discord-btn">
    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png">
  </a>
</header>

<section class="hero">
  <p class="status">// status: online</p>

  <h2>
    THE CORE <br>
    <span>OF POWER.</span>
  </h2>

  <p class="typing"></p>

  <button class="deploy" onclick="deploy()">
    DEPLOY FREE SERVER
  </button>
</section>

<section class="locations">
  <h2 class="location-title">AVAILABLE LOCATION</h2>

  <div class="cards">
    <div class="card">MUMBAI.<span class="active">ACTIVE // INDIA</span></div>
    <div class="card">SINGAPORE.<span class="active">ACTIVE // ASIA</span></div>
    <div class="card">GERMANY.<span class="active">ACTIVE</span></div>
    <div class="card">UAE.<span class="pending">PENDING</span></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
